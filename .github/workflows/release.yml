# Keeps marqius/wkhtmltopdf on the latest release of marqius-wkhtmltopdf, and proves it works first:
#
#   every hour     when marqius-wkhtmltopdf's latest GitHub release is newer than the package, each
#                  build is checked against its published SHA-256 and GitHub build provenance, and the
#                  checksums are written into the package.
#                  Composer installs it, as the README prints it, and Snappy, laravel-snappy,
#                  phpwkhtmltopdf, KnpSnappyBundle and CakePdf make PDFs with it on Linux (x86-64 and
#                  ARM64), macOS (Apple silicon) and Windows. Only then is it committed and tagged for
#                  Packagist, and the README's lines run again from Packagist itself. An hour with no
#                  new release ends after that first check: there is nothing new to test.
#   by hand        Actions > Release > Run workflow: the same, now; it also publishes the package's
#                  own release if it has no tag yet, which is how the first release goes out
#   on a change    to main, or in a pull request: the package as it stands, on the same four
#   live, by hand  Actions > Release > Run workflow, "live" ticked: this README's lines, as printed, with
#                  the newest version on Packagist, on the same four; nothing is built or published
#   while private  the hourly check does not run
#   publishing     only from a public repository whose variable PUBLISHING is "on"
name: Release

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      live:
        description: "Only run this README's lines with the newest version on Packagist (nothing is built or published)"
        type: boolean
        default: false
      dry_run:
        description: "Rehearsal: build and test the latest marqius-wkhtmltopdf release as if it were new, without the macOS lane; publish nothing"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # a rehearsal neither waits behind a run that publishes nor takes its place
  group: release-${{ github.ref }}${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  follow:
    # while the repository is private, the hourly check does not run (it would spend private minutes)
    if: github.event_name != 'schedule' || !github.event.repository.private
    runs-on: ubuntu-24.04
    outputs:
      new: ${{ steps.follow.outputs.new }}
      publish: ${{ steps.follow.outputs.publish }}
      version: ${{ steps.follow.outputs.version }}
      live: ${{ steps.follow.outputs.live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: follow
        name: Follow marqius-wkhtmltopdf's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_ONLY: ${{ inputs.live }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          . src/release.sh
          new=false publish=false live=false target=$version
          if [ "$LIVE_ONLY" = true ]; then
            live=true # run by hand, live only: the README's lines with what Packagist has now
          elif [ "$DRY_RUN" = true ]; then
            # a rehearsal: the latest release, built and tested as if it were new; the publish job is skipped
            latest=$(python3 .github/release.py latest)
            new=true publish=true target=$latest
          elif [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            latest=$(python3 .github/release.py latest)
            if python3 .github/release.py newer "$latest" "$version"; then
              new=true publish=true target=$latest
            elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$(git ls-remote --tags origin "refs/tags/$version")" ]; then
              publish=true # run by hand, and the package's own release has no tag yet: the first one
            fi
          fi
          echo "package $version, latest release ${latest:-not asked}: new=$new publish=$publish live=$live"
          printf 'new=%s\npublish=%s\nversion=%s\nlive=%s\n' "$new" "$publish" "$target" "$live" >>"$GITHUB_OUTPUT"
      - name: Check the new release's builds and write their checksums into the package
        if: steps.follow.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.follow.outputs.version }}
        run: |
          python3 .github/release.py fetch "$VERSION" "$RUNNER_TEMP/builds"
          python3 .github/write-release.py "$VERSION" "$RUNNER_TEMP/builds"
      - if: steps.follow.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            src/release.php
            src/release.sh
          retention-days: 7

  test:
    needs: follow
    # every hour, only when there is a release to publish: the other hours have nothing new to test
    if: >-
      needs.follow.outputs.live != 'true' &&
      (github.event_name != 'schedule' || needs.follow.outputs.publish == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            libraries: quickstart snappy image phpwkhtmltopdf cakepdf laravel-snappy laravel-snappy-config knpsnappybundle knpsnappybundle-php languages
          - runner: ubuntu-24.04-arm
            libraries: quickstart snappy image phpwkhtmltopdf cakepdf laravel-snappy laravel-snappy-config knpsnappybundle knpsnappybundle-php languages
          # macOS (Apple silicon): the test-macos job, so that a rehearsal can leave it out
          # on Windows, KnpSnappyBundle is set up with the README's PHP, as the README says, and
          # phpwkhtmltopdf with its useExec option, as the README says until 0.12.14 (with its default
          # settings there the program stops before it writes the PDF; the engine fix is for 0.12.14)
          - runner: windows-2025
            libraries: quickstart snappy image cakepdf laravel-snappy laravel-snappy-config knpsnappybundle-php phpwkhtmltopdf-windows languages
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub's Intel Ubuntu machines download from a slow mirror (the README's 75 MB of fonts took
      # 7 to 13 minutes there): the packages earlier runs downloaded go where apt looks first. apt
      # still checks each one against its index, and downloads any that changed.
      - name: Packages earlier runs downloaded, where apt looks first
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-archives-${{ runner.arch }}-
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          n=$(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          echo "$n packages from earlier runs"
      - if: needs.follow.outputs.new == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: src
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: zip, intl, pdo_sqlite, fileinfo, mbstring, openssl, curl
          tools: composer:v2
          coverage: none
      - name: Install with Composer, and make PDFs with each library
        run: |
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -m "$tmp"); fi
          tests/artifact.sh "$tmp/zips"
          export MARQIUS_COMPOSER_REPO="{\"type\":\"artifact\",\"url\":\"$tmp/zips\"}"
          tests/examples.sh "$tmp/allowed" ${{ matrix.libraries }}
          PLUGIN=off tests/examples.sh "$tmp/blocked" snappy
      - name: Keep the packages this run downloaded, for the next run
        id: apt-keep
        if: always() && runner.os == 'Linux'
        run: |
          new=0
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            [ -e ~/apt-archives/"${f##*/}" ] && continue
            cp "$f" ~/apt-archives/ && new=$((new + 1))
          done
          echo "$new packages new to the cache"
          echo "new=$new" >>"$GITHUB_OUTPUT"
      - if: always() && runner.os == 'Linux' && steps.apt-keep.outputs.new != '' && steps.apt-keep.outputs.new != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}

  test-macos:
    # the test's macOS (Apple silicon) lane, as its own job: a rehearsal publishes nothing and leaves it
    # out (GitHub often has no Mac to give); publishing needs it, as before
    needs: follow
    if: >-
      needs.follow.outputs.live != 'true' && !inputs.dry_run &&
      (github.event_name != 'schedule' || needs.follow.outputs.publish == 'true')
    name: test (macos-15, quickstart snappy image phpwkhtmltopdf cakepdf laravel-snappy laravel-snappy-config knpsnappybundle knpsnappybundle-php languages)
    runs-on: macos-15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: needs.follow.outputs.new == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: src
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: zip, intl, pdo_sqlite, fileinfo, mbstring, openssl, curl
          tools: composer:v2
          coverage: none
      - name: Install with Composer, and make PDFs with each library
        run: |
          tmp=$RUNNER_TEMP
          tests/artifact.sh "$tmp/zips"
          export MARQIUS_COMPOSER_REPO="{\"type\":\"artifact\",\"url\":\"$tmp/zips\"}"
          tests/examples.sh "$tmp/allowed" quickstart snappy image phpwkhtmltopdf cakepdf laravel-snappy laravel-snappy-config knpsnappybundle knpsnappybundle-php languages
          PLUGIN=off tests/examples.sh "$tmp/blocked" snappy

  publish:
    needs: [follow, test, test-macos]
    if: >-
      needs.follow.outputs.publish == 'true' && github.ref == 'refs/heads/main' &&
      vars.PUBLISHING == 'on' && !github.event.repository.private && !inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - if: needs.follow.outputs.new == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: src
      - name: Commit and tag the release that passed
        env:
          VERSION: ${{ needs.follow.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . src/release.sh
          [ "$version" = "$VERSION" ]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/release.php src/release.sh; then
            git add src/release.php src/release.sh
            git commit -q -m "marqius-wkhtmltopdf $VERSION" -m "Installed with Composer and run through Snappy, laravel-snappy, phpwkhtmltopdf, KnpSnappyBundle and CakePdf on Linux (x86-64, ARM64), macOS (Apple silicon) and Windows: $RUN_URL"
          fi
          git tag -a "$VERSION" -m "marqius-wkhtmltopdf $VERSION" -m "Tested: $RUN_URL"
          git push -q origin HEAD:main "refs/tags/$VERSION"
      # Packagist's GitHub hook takes the tag on its own; this is for a repository without the hook
      - name: Tell Packagist
        if: env.PACKAGIST_TOKEN != ''
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $PACKAGIST_USERNAME:$PACKAGIST_TOKEN" \
            -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}' \
            https://packagist.org/api/update-package

  live:
    needs: [follow, publish]
    # after a publish, or by hand with "live" ticked
    if: >-
      always() && needs.follow.result == 'success' &&
      (needs.publish.result == 'success' || needs.follow.outputs.live == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            libraries: quickstart snappy image phpwkhtmltopdf cakepdf laravel-snappy laravel-snappy-config knpsnappybundle knpsnappybundle-php languages
          - runner: ubuntu-24.04-arm
            libraries: quickstart snappy phpwkhtmltopdf cakepdf laravel-snappy languages
          - runner: macos-15
            libraries: quickstart snappy phpwkhtmltopdf cakepdf laravel-snappy languages
          - runner: windows-2025
            libraries: quickstart snappy phpwkhtmltopdf-windows cakepdf laravel-snappy languages
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the release just tagged; by hand, the README as it stands on the branch run
          ref: ${{ needs.follow.outputs.live == 'true' && github.sha || needs.follow.outputs.version }}
      # GitHub's Intel Ubuntu machines download from a slow mirror (the README's 75 MB of fonts took
      # 7 to 13 minutes there): the packages earlier runs downloaded go where apt looks first. apt
      # still checks each one against its index, and downloads any that changed.
      - name: Packages earlier runs downloaded, where apt looks first
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: apt-archives-${{ runner.arch }}-
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives
          n=$(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l)
          if [ "$n" -gt 0 ]; then sudo cp ~/apt-archives/*.deb /var/cache/apt/archives/; fi
          echo "$n packages from earlier runs"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: zip, intl, pdo_sqlite, fileinfo, mbstring, openssl, curl
          tools: composer:v2
          coverage: none
      - name: Wait for Packagist to list the release
        if: needs.follow.outputs.live != 'true'
        env:
          VERSION: ${{ needs.follow.outputs.version }}
        run: |
          for _ in $(seq 120); do
            curl -fsS https://repo.packagist.org/p2/marqius/wkhtmltopdf.json | grep -q "\"version\":\"$VERSION\"" && exit 0
            sleep 10
          done
          echo "Packagist does not list marqius/wkhtmltopdf $VERSION after 20 minutes" >&2
          exit 1
      - name: The README's lines, as printed, from Packagist
        run: |
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -m "$tmp"); fi
          tests/examples.sh "$tmp/live" ${{ matrix.libraries }}
      - name: Keep the packages this run downloaded, for the next run
        id: apt-keep
        if: always() && runner.os == 'Linux'
        run: |
          new=0
          for f in /var/cache/apt/archives/*.deb; do
            [ -e "$f" ] || continue
            [ -e ~/apt-archives/"${f##*/}" ] && continue
            cp "$f" ~/apt-archives/ && new=$((new + 1))
          done
          echo "$new packages new to the cache"
          echo "new=$new" >>"$GITHUB_OUTPUT"
      - if: always() && runner.os == 'Linux' && steps.apt-keep.outputs.new != '' && steps.apt-keep.outputs.new != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-archives-${{ runner.arch }}-${{ github.run_id }}-${{ github.job }}-${{ strategy.job-index }}
